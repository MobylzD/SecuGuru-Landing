<!DOCTYPE html>
<html lang="en">
<head>

    <script src="https://cdn.tailwindcss.com"></script>

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans">
    <!-- Navigation -->
    <header class="border-b border-slate-800 p-6">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <span class="text-xl font-bold tracking-wider text-cyan-400">SECUGURU<span class="text-slate-400">.XYZ</span></span>
            <span class="bg-cyan-950 text-cyan-300 text-xs px-3 py-1 rounded-full border border-cyan-800">Status: Active</span>
        </div>
    </header>

    <!-- Hero Content -->
    <main class="max-w-3xl mx-auto px-6 py-20 text-center">
        <div class="inline-block p-3 bg-slate-800 rounded-2xl mb-6 border border-slate-700">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">

        <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight mb-6 bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
            Security & Infrastructure Labs
        </h1>
        <p class="text-lg text-slate-400 mb-8 leading-relaxed">
            `secuguru.xyz` is currently being configured. Exploring Cloudflare Edge Workers, DNS security models, and cloud-native architectures.
        </p>
        <div class="flex justify-center gap-4 text-sm">
            <div class="bg-slate-800/60 border border-slate-700 px-4 py-2 rounded-lg text-slate-300">
                <span class="text-slate-500">CDN:</span> Cloudflare
            </div>
            <div class="bg-slate-800/60 border border-slate-700 px-4 py-2 rounded-lg text-slate-300">
                <span class="text-slate-500">Host:</span> Cloudflare Pages
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 p-6 text-center text-slate-500 text-sm">
        &copy; 2026 SecuGuru. Hosted on Cloudflare Pages.
